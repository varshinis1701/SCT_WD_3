
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <header>
            <p class="tagline">SKILLCRAFT TECHNOLOGY PRESENTS</p>
            <h1>TIC <span>TAC</span> TOE</h1>
            <p class="subtitle">Challenge your mind. Make your move!</p>
        </header>

        <div class="mode-section">
            <h3>SELECT GAME MODE</h3>
            <div class="mode-buttons">
                <button class="mode-btn active" id="pvp">
                    👥 Player vs Player
                </button>
                <button class="mode-btn" id="pvc">
                    🤖 Player vs Computer
                </button>
            </div>
        </div>

        <div class="scoreboard">
            <div class="score-card x-card">
                <span class="player-symbol">X</span>
                <p id="playerX">Player X</p>
                <h2 id="scoreX">0</h2>
            </div>

            <div class="score-card draw-card">
                <span>🤝</span>
                <p>Draws</p>
                <h2 id="scoreDraw">0</h2>
            </div>

            <div class="score-card o-card">
                <span class="player-symbol">O</span>
                <p id="playerO">Player O</p>
                <h2 id="scoreO">0</h2>
            </div>
        </div>

        <div class="status-box">
            <div class="turn-indicator" id="turnIndicator">X</div>
            <div>
                <h3 id="status">Player X's Turn</h3>
                <p id="message">Choose a square to make your move</p>
            </div>
        </div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="result" id="result"></div>

        <div class="action-buttons">
            <button id="restartBtn" class="restart-btn">
                ↻ Restart Game
            </button>
            <button id="resetBtn" class="reset-btn">
                Reset Scores
            </button>
        </div>

        <footer>
            <p>Designed with ❤️ by SkillCraft Technology</p>
            <p>Think Smart • Play Fair • Win Big</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
